<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlagGuessr</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; }
        
        #map-container {
            width: 100vw;
            height: 100vh;
            background-color: #1e293b;
            cursor: crosshair;
        }

        /* Leaflet Specific Overrides */
        .leaflet-container { background: #000; outline: 0; }
        .leaflet-control-zoom { border: none !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5) !important; }
        .leaflet-control-zoom a { background-color: #1e293b !important; color: #cbd5e1 !important; border-color: #334155 !important; }
        .leaflet-control-zoom a:hover { background-color: #334155 !important; color: #fff !important; }

        /* Country Polygon Styles */
        .country-border {
            transition: fill-opacity 0.2s, stroke-opacity 0.2s;
            outline: none;
        }

        /* GeoGuessr Style Labels (Black with white shadow) */
        .country-label {
            background: transparent;
            border: none;
            box-shadow: none;
            font-weight: 800;
            font-size: 14px;
            color: #111827; /* Dark almost black */
            text-shadow: 
                -1.5px -1.5px 0 rgba(255,255,255,0.7),
                 1.5px -1.5px 0 rgba(255,255,255,0.7),
                -1.5px  1.5px 0 rgba(255,255,255,0.7),
                 1.5px  1.5px 0 rgba(255,255,255,0.7);
            text-align: center;
            white-space: nowrap;
            pointer-events: none; /* Let clicks pass through to map */
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        /* Hides all labels when map is zoomed in past a certain point */
        .hide-labels .country-label {
            opacity: 0 !important;
        }

        /* Custom UI Styles */
        .flag-loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="text-white font-sans antialiased selection:bg-blue-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <div id="game-ui" class="fixed top-0 left-0 w-full bg-slate-900/90 backdrop-blur-md shadow-lg border-b border-slate-700 z-[1000] hidden items-center justify-between px-4 py-2 md:px-6 md:py-3">
        <div class="flex items-center gap-2 md:gap-3">
            <button onclick="showMainMenu()" class="bg-slate-700 hover:bg-slate-600 text-white p-2 rounded-lg transition mr-1 md:mr-2" title="Quit to Menu">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
            <div class="bg-slate-800 rounded-lg px-3 py-1 md:px-4 md:py-2 border border-slate-600 flex flex-col items-center">
                <span class="text-[10px] md:text-xs text-slate-400 uppercase font-bold tracking-wider">Score</span>
                <div class="flex items-baseline gap-1">
                    <span id="score" class="text-xl md:text-2xl font-black text-blue-400">0</span>
                    <span class="text-xs md:text-sm font-bold text-slate-500">/ <span id="total-countries">0</span></span>
                </div>
            </div>
        </div>

        <div class="relative group">
            <div class="h-16 w-24 md:h-20 md:w-32 bg-slate-800 rounded-md border-2 border-slate-600 overflow-hidden shadow-inner flex items-center justify-center">
                <div id="flag-loader" class="text-slate-500 text-xs md:text-sm flag-loading hidden">Loading...</div>
                <img id="flag-display" src="" alt="Guess this flag" class="w-full h-full object-cover hidden" onload="this.classList.remove('hidden'); document.getElementById('flag-loader').classList.add('hidden');">
            </div>
        </div>

        <div class="text-right text-xs md:text-sm text-slate-400 hidden sm:block">
            <p>Pinch/Scroll to <span class="text-slate-200 font-semibold">Zoom</span></p>
            <p>Drag to <span class="text-slate-200 font-semibold">Pan</span></p>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900 z-[2000] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <h2 class="text-xl font-bold text-slate-200">Loading Satellite Map...</h2>
    </div>

    <!-- Main Menu Overlay -->
    <div id="main-menu-overlay" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[1500] hidden flex-col items-center justify-center overflow-y-auto p-4">
        <div class="bg-slate-800 p-6 md:p-10 rounded-3xl border border-slate-600 shadow-2xl text-center max-w-lg w-full my-auto">
            <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-1 pb-2 tracking-wide">FlagGuessr</h1>
            <div class="text-[10px] md:text-xs text-slate-500 font-semibold mb-6 uppercase tracking-widest">By Neowise</div>
            <p class="text-slate-400 text-sm md:text-base mb-8">Select your practice mode</p>
            
            <div class="space-y-4 mb-8">
                <button onclick="startGame('duel')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 md:py-4 px-4 md:px-6 rounded-xl transition duration-200 flex flex-col items-center group">
                    <span class="text-lg md:text-xl">Duel Practice</span>
                    <span class="text-[10px] md:text-xs text-blue-200 font-normal mt-1 opacity-80 group-hover:opacity-100">Standard GeoGuessr Countries Only</span>
                </button>
                <button onclick="startGame('arbitrary')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 md:py-4 px-4 md:px-6 rounded-xl transition duration-200 flex flex-col items-center group">
                    <span class="text-lg md:text-xl">Arbitrary World</span>
                    <span class="text-[10px] md:text-xs text-emerald-200 font-normal mt-1 opacity-80 group-hover:opacity-100">Includes obscure territories and islands</span>
                </button>
            </div>

            <button onclick="showLeaderboard()" class="text-slate-300 hover:text-white font-semibold underline decoration-slate-500 hover:decoration-white transition text-sm md:text-base">
                View Leaderboard
            </button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over-overlay" class="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[1500] hidden flex-col items-center justify-center p-4">
        <div class="bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-600 shadow-2xl text-center max-w-md w-full">
            <h1 class="text-3xl md:text-4xl font-black text-red-500 mb-2">Incorrect!</h1>
            <p class="text-slate-300 text-base md:text-lg mb-6">
                That was <span id="correct-answer-name" class="font-bold text-blue-400 text-xl md:text-2xl block mt-2">Country Name</span>
            </p>
            
            <div class="mb-6">
                <div class="text-xs md:text-sm text-slate-400 mb-1">Final Score</div>
                <div id="final-score" class="text-4xl md:text-5xl font-black text-white">0</div>
            </div>

            <div id="score-submit-section" class="bg-slate-700/50 p-4 rounded-xl mb-6">
                <p class="text-xs md:text-sm text-slate-300 mb-2 font-semibold">Save your score to the leaderboard!</p>
                <div class="flex gap-2">
                    <input type="text" id="player-name" onkeypress="if(event.key === 'Enter') saveScore()" placeholder="Enter your name..." maxlength="15" class="flex-1 bg-slate-900 border border-slate-600 text-white px-3 md:px-4 py-2 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                    <button id="save-score-btn" onclick="saveScore()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-3 md:px-4 py-2 rounded-lg transition text-sm md:text-base">Save</button>
                </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="restartGame()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition text-sm md:text-base">Play Again</button>
                <button onclick="showMainMenu()" class="flex-1 bg-slate-600 hover:bg-slate-500 text-white font-bold py-3 px-4 rounded-xl transition text-sm md:text-base">Main Menu</button>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[2000] hidden flex-col items-center justify-center p-4">
        <div class="bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-600 shadow-2xl max-w-lg w-full flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl md:text-3xl font-black text-white">Top Streaks</h2>
                <button onclick="closeLeaderboard()" class="text-slate-400 hover:text-white">
                    <svg class="w-6 h-6 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="overflow-y-auto pr-2 flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-slate-400 text-xs md:text-sm border-b border-slate-700">
                            <th class="pb-2 font-semibold">Rank</th>
                            <th class="pb-2 font-semibold">Name</th>
                            <th class="pb-2 font-semibold text-center">Mode</th>
                            <th class="pb-2 font-semibold text-right">Score</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="text-sm md:text-lg">

                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- AUDIO SYNTHESIZER ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playTone(freq, type, duration, vol, slideFreq = null) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(freq, now);
            if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, now + duration);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(vol, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            osc.start(now);
            osc.stop(now + duration);
        }
        function playCorrectSound() { initAudio(); playTone(523.25, 'sine', 0.15, 0.3); setTimeout(() => playTone(783.99, 'sine', 0.4, 0.3), 100); }
        function playIncorrectSound() { initAudio(); playTone(250, 'triangle', 0.4, 0.5, 100); }

            "EGY": { code2: "eg", name: "Egypt" }, "ISL": { code2: "is", name: "Iceland" },
            "IRL": { code2: "ie", name: "Ireland" }, "PRT": { code2: "pt", name: "Portugal" },
            "CHE": { code2: "ch", name: "Switzerland" }, "AUT": { code2: "at", name: "Austria" },
            "CZE": { code2: "cz", name: "Czechia" }, "SVK": { code2: "sk", name: "Slovakia" },
            "HUN": { code2: "hu", name: "Hungary" }, "ROU": { code2: "ro", name: "Romania" },

            "UKR": { code2: "ua", name: "Ukraine" }, "ARE": { code2: "ae", name: "United Arab Emirates" },
            "ISR": { code2: "il", name: "Israel" }, "SAU": { code2: "sa", name: "Saudi Arabia" },

            "GHA": { code2: "gh", name: "Ghana" }, "TUN": { code2: "tn", name: "Tunisia" },

            "KGZ": { code2: "kg", name: "Kyrgyzstan" }, "BTN": { code2: "bt", name: "Bhutan" },
            "BGD": { code2: "bd", name: "Bangladesh" }, "LKA": { code2: "lk", name: "Sri Lanka" },
            "KHM": { code2: "kh", name: "Cambodia" }, "ALB": { code2: "al", name: "Albania" },
            "MNE": { code2: "me", name: "Montenegro" }, "BIH": { code2: "ba", name: "Bosnia and Herzegovina" },
            "MKD": { code2: "mk", name: "North Macedonia" }, "SVN": { code2: "si", name: "Slovenia" },

        };

        const arbitraryAdditions = {
            "GRL": { code2: "gl", name: "Greenland" }, "PRI": { code2: "pr", name: "Puerto Rico" },
            "NCL": { code2: "nc", name: "New Caledonia" }, "GUF": { code2: "gf", name: "French Guiana" },
            "FRO": { code2: "fo", name: "Faroe Islands" }, "ATA": { code2: "aq", name: "Antarctica" },

            "JAM": { code2: "jm", name: "Jamaica" }, "HTI": { code2: "ht", name: "Haiti" },
            "PNG": { code2: "pg", name: "Papua New Guinea" }, "FJI": { code2: "fj", name: "Fiji" },

            "AFG": { code2: "af", name: "Afghanistan" }, "SYR": { code2: "sy", name: "Syria" },

            "AGO": { code2: "ao", name: "Angola" }, "ZWE": { code2: "zw", name: "Zimbabwe" }, 
            "NAM": { code2: "na", name: "Namibia" }, "MMR": { code2: "mm", name: "Myanmar" }, 
            "NPL": { code2: "np", name: "Nepal" }
        };

        const arbitraryCountries = { ...duelCountries, ...arbitraryAdditions };

        // Location overrides for properly centering names on scattered countries
        const labelOverrides = {
            "USA": [39.0, -98.5], "CAN": [60.0, -100.0], "FRA": [46.2, 2.2], 
            "GBR": [55.3, -3.4], "NZL": [-40.9, 174.0], "RUS": [60.0, 90.0],
            "ESP": [40.4, -3.7], "PRT": [39.3, -8.2], "ZAF": [-29.0, 25.0],
            "NOR": [61.0, 10.0], "HRV": [45.0, 15.5], "CHL": [-35.6, -71.5], 
            "GRC": [39.0, 22.0], "IDN": [-1.0, 114.0], "MYS": [4.0, 102.0], 
            "PHL": [12.0, 121.0], "FIN": [63.0, 26.0], "SWE": [62.0, 16.0], 
            "ITA": [42.5, 12.5], "VNM": [14.0, 108.0]
        };

        // --- GAME STATE ---
        let map, geojsonLayer, labelsLayer;
        let activeDictionary = {};
        let availableCountries = []; 
        let unplayedCountries = [];
        let currentTarget = "";
        let score = 0;
        let currentMode = "duel";
        let isInputLocked = false;
        let rawGeoJsonData = null;
        let mapCountryPolygons = {}; // Map ISO3 to Leaflet Layer

        // --- LEAFLET MAP SETUP ---
        function initMap() {
            // Create map, center on Europe/Africa, zoom out
            map = L.map('map-container', {
                center: [20, 0],
                zoom: 2,
                minZoom: 2,
                maxZoom: 9,
                zoomControl: false // We will move it
            });

            // Move zoom controls to bottom right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // 1. ADD SATELLITE BASE LAYER (Esri World Imagery)
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 18
            }).addTo(map);

            // 2. Setup Label Fading Logic Based on Zoom
            // If zoomed in tight (> 4), hide labels just like GeoGuessr
            map.on('zoomend', function() {
                const currentZoom = map.getZoom();
                const container = document.getElementById('map-container');
                if (currentZoom > 4) {
                    container.classList.add('hide-labels');
                } else {
                    container.classList.remove('hide-labels');
                }
            });

            // Fetch Topo/GeoJSON geometry data
            fetch("https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson")
                .then(response => response.json())
                .then(data => {
                    rawGeoJsonData = data;
                    document.getElementById("loading-overlay").style.display = "none";
                    document.getElementById("main-menu-overlay").classList.remove("hidden");
                    document.getElementById("main-menu-overlay").classList.add("flex");
                });
        }

        function renderGameMap(dictionary) {
            // Clean up old layers
            if (geojsonLayer) map.removeLayer(geojsonLayer);
            if (labelsLayer) map.removeLayer(labelsLayer);
            mapCountryPolygons = {};

            const mapCountryIDs = rawGeoJsonData.features.map(f => f.id);
            availableCountries = Object.keys(dictionary).filter(id => mapCountryIDs.includes(id));

            // Group for text labels
            labelsLayer = L.layerGroup().addTo(map);

            // Draw Interactive Polygons over Satellite
            geojsonLayer = L.geoJSON(rawGeoJsonData, {
                filter: feature => availableCountries.includes(feature.id),
                style: {
                    color: 'rgba(255, 255, 255, 0.4)', // Faint white borders
                    weight: 1, // Very thin
                    fillColor: 'transparent',
                    fillOpacity: 0.01 // Invisible but clickable
                },
                onEachFeature: (feature, layer) => {
                    // Save reference
                    mapCountryPolygons[feature.id] = layer;

                    // Hover effects
                    layer.on('mouseover', () => {
                        if (isInputLocked) return;
                        layer.setStyle({ fillColor: '#60a5fa', fillOpacity: 0.3 }); // Light blue highlight
                    });
                    layer.on('mouseout', () => {
                        if (isInputLocked || layer.options.fillColor === '#22c55e') return; // Don't wipe correct greens
                        layer.setStyle({ fillColor: 'transparent', fillOpacity: 0.01 });
                    });

                    // Click event
                    layer.on('click', () => handleCountryClick(feature.id, layer));

                    // Generate Label
                    const center = labelOverrides[feature.id] || layer.getBounds().getCenter();
                    const labelIcon = L.divIcon({
                        className: 'country-label',
                        html: dictionary[feature.id].name,
                        iconSize: [100, 20]
                    });
                    L.marker(center, { icon: labelIcon, interactive: false }).addTo(labelsLayer);
                }
            }).addTo(map);
        }

        // --- GAME LOGIC ---
        function startGame(mode) {
            initAudio(); 
            currentMode = mode;
            activeDictionary = mode === 'duel' ? duelCountries : arbitraryCountries;
            
            document.getElementById("current-mode-display").innerText = mode === 'duel' ? "Duel" : "Arbitrary";
            document.getElementById("main-menu-overlay").classList.add("hidden");
            document.getElementById("main-menu-overlay").classList.remove("flex");
            document.getElementById("game-ui").classList.remove("hidden");
            document.getElementById("game-ui").classList.add("flex");

            score = 0;
            document.getElementById("score").innerText = score;
            
            // Reset Map View
            map.setView([20, 0], 2);
            document.getElementById('map-container').classList.remove('hide-labels');

            renderGameMap(activeDictionary); 
            
            document.getElementById("total-countries").innerText = availableCountries.length;
            unplayedCountries = [...availableCountries];
            
            startRound();
        }

        function showMainMenu() {
            document.getElementById("game-over-overlay").classList.add("hidden");
            document.getElementById("game-over-overlay").classList.remove("flex");
            document.getElementById("game-ui").classList.add("hidden");
            document.getElementById("game-ui").classList.remove("flex");
            
            document.getElementById("main-menu-overlay").classList.remove("hidden");
            document.getElementById("main-menu-overlay").classList.add("flex");
        }

        function startRound() {
            isInputLocked = false;
            
            if (unplayedCountries.length === 0) unplayedCountries = [...availableCountries];
            
            const randomIndex = Math.floor(Math.random() * unplayedCountries.length);
            currentTarget = unplayedCountries[randomIndex];
            unplayedCountries.splice(randomIndex, 1);
            
            const flagData = activeDictionary[currentTarget];
            const flagImg = document.getElementById("flag-display");
            flagImg.classList.add("hidden");
            document.getElementById("flag-loader").classList.remove("hidden");
            flagImg.src = `https://flagcdn.com/w320/${flagData.code2}.png`;
        }

        function handleCountryClick(clickedId, layer) {
            if (isInputLocked) return;
            isInputLocked = true;

            if (clickedId === currentTarget) {
                playCorrectSound();
                score++;
                document.getElementById("score").innerText = score;
                
                // Keep it green
                layer.setStyle({ fillColor: '#22c55e', fillOpacity: 0.5 });
                
                setTimeout(startRound, 400);
            } else {
                playIncorrectSound();
                
                // Flash clicked red
                layer.setStyle({ fillColor: '#ef4444', fillOpacity: 0.6 });
                
                // Highlight correct answer green
                const correctLayer = mapCountryPolygons[currentTarget];
                if (correctLayer) correctLayer.setStyle({ fillColor: '#22c55e', fillOpacity: 0.6 });

                setTimeout(() => {
                    showGameOver();
                }, 800);
            }
        }

        function showGameOver() {
            document.getElementById("final-score").innerText = score;
            document.getElementById("correct-answer-name").innerText = activeDictionary[currentTarget].name;
            
            const nameInput = document.getElementById("player-name");
            const saveBtn = document.getElementById("save-score-btn");
            const saveMsg = document.getElementById("save-msg");
            
            nameInput.value = "";
            nameInput.disabled = false;
            saveBtn.innerText = "Save";
            saveBtn.disabled = false;
            saveBtn.className = "bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-3 md:px-4 py-2 rounded-lg transition text-sm md:text-base";
            saveMsg.classList.add("hidden");

            document.getElementById("score-submit-section").style.display = score > 0 ? "block" : "none";
            document.getElementById("game-over-overlay").classList.remove("hidden");
            document.getElementById("game-over-overlay").classList.add("flex");
        }

        function restartGame() {
            document.getElementById("game-over-overlay").classList.add("hidden");
            document.getElementById("game-over-overlay").classList.remove("flex");
            
            score = 0;
            document.getElementById("score").innerText = score;
            unplayedCountries = [...availableCountries];
            
            // Reset map zoom and colors
            map.setView([20, 0], 2);
            document.getElementById('map-container').classList.remove('hide-labels');
            renderGameMap(activeDictionary);
            
            startRound();
        }

        // --- LEADERBOARD LOGIC ---
        function saveScore() {
            const nameInput = document.getElementById("player-name");
            const name = nameInput.value.trim();
            const saveMsg = document.getElementById("save-msg");

            if (!name) {
                saveMsg.innerText = "Please enter a name first!";
                saveMsg.className = "text-red-400 text-xs font-bold mt-2";
                return;
            }

            try {
                let leaderboard = JSON.parse(localStorage.getItem("flagGamerLeaderboard")) || [];
                leaderboard.push({ name, score, mode: currentMode === 'duel' ? 'Duel' : 'Arbitrary', date: Date.now() });
                leaderboard.sort((a, b) => b.score - a.score);
                localStorage.setItem("flagGamerLeaderboard", JSON.stringify(leaderboard.slice(0, 50)));
                
                saveMsg.innerText = "Score Saved to Leaderboard!";
                saveMsg.className = "text-green-400 text-xs font-bold mt-2";
                
                const saveBtn = document.getElementById("save-score-btn");
                saveBtn.innerText = "Saved!";
                saveBtn.disabled = true;
                saveBtn.className = "bg-green-500 cursor-not-allowed text-slate-900 font-bold px-3 md:px-4 py-2 rounded-lg transition text-sm md:text-base";
                nameInput.disabled = true;
            } catch (e) {
                saveMsg.innerText = "Error saving. Browser blocking storage.";
                saveMsg.className = "text-red-400 text-xs font-bold mt-2";
            }
        }

        function showLeaderboard() {
            document.getElementById("main-menu-overlay").classList.add("hidden");
            document.getElementById("main-menu-overlay").classList.remove("flex");
            document.getElementById("game-over-overlay").classList.add("hidden");
            document.getElementById("game-over-overlay").classList.remove("flex");
            
            const tbody = document.getElementById("leaderboard-body");
            const leaderboard = JSON.parse(localStorage.getItem("flagGamerLeaderboard")) || [];

            if (leaderboard.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-500">No scores saved yet!</td></tr>`;
            } else {
                tbody.innerHTML = leaderboard.map((entry, index) => {
                    let rankColor = index === 0 ? "text-yellow-400 font-bold" : index === 1 ? "text-slate-300 font-bold" : index === 2 ? "text-amber-600 font-bold" : "text-slate-300";
                    let modeColor = entry.mode === 'Duel' ? 'bg-blue-600/20 text-blue-400' : 'bg-emerald-600/20 text-emerald-400';
                    return `
                        <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 transition">
                            <td class="py-3 ${rankColor}">#${index + 1}</td>
                            <td class="py-3 font-semibold text-white">${entry.name}</td>
                            <td class="py-3 text-center"><span class="px-2 py-1 rounded text-[10px] md:text-xs font-bold ${modeColor}">${entry.mode}</span></td>
                            <td class="py-3 text-right font-black text-white">${entry.score}</td>
                        </tr>
                    `;
                }).join('');
            }
            document.getElementById("leaderboard-modal").classList.remove("hidden");
            document.getElementById("leaderboard-modal").classList.add("flex");
        }

        function closeLeaderboard() {
            document.getElementById("leaderboard-modal").classList.add("hidden");
            document.getElementById("leaderboard-modal").classList.remove("flex");
            if (document.getElementById("game-ui").classList.contains("hidden")) {
                document.getElementById("main-menu-overlay").classList.remove("hidden");
                document.getElementById("main-menu-overlay").classList.add("flex");
            } else {
                document.getElementById("game-over-overlay").classList.remove("hidden");
                document.getElementById("game-over-overlay").classList.add("flex");
            }
        }

        // Boot
        window.onload = initMap;
    </script>
</body>
</html>
